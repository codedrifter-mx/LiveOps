<!DOCTYPE html>
<html lang="en">
<head><script data-od-sandbox-shim>(function(){
  function makeStore(){
    var data = {};
    var api = {
      getItem: function(k){ return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null; },
      setItem: function(k, v){ data[k] = String(v); },
      removeItem: function(k){ delete data[k]; },
      clear: function(){ data = {}; },
      key: function(i){ return Object.keys(data)[i] || null; }
    };
    Object.defineProperty(api, 'length', { get: function(){ return Object.keys(data).length; } });
    return api;
  }
  function tryShim(name){
    var works = false;
    try { works = !!window[name] && typeof window[name].getItem === 'function'; void window[name].length; }
    catch (_) { works = false; }
    if (works) return;
    try { Object.defineProperty(window, name, { configurable: true, value: makeStore() }); }
    catch (_) { try { window[name] = makeStore(); } catch (__) {} }
  }
  tryShim('localStorage');
  tryShim('sessionStorage');
})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveOps NOC Dashboard</title>
    <!-- Tailwind v4 (experimental CDN) -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style type="text/tailwindcss">
        @theme {
            --font-sans: 'Plus Jakarta Sans', system-ui;
            --font-mono: 'Spline Sans Mono', ui-monospace;
            
            --color-bg: #EDEDF5;
            --color-surface: #FFFFFF;
            --color-border: #DBDBE5;
            --color-primary: #010507;
            --color-muted: #57575B;
            
            --color-lilac: #BEC2FF;
            --color-mint: #85ECCE;
            --color-blue: #3D92E8;
            --color-orange: #FFAC4D;
            --color-red: #FA5F67;
            
            --radius-card: 0.75rem;
        }

        @layer base {
            body {
                @apply bg-bg text-primary font-sans antialiased;
            }
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        .animate-pulse-red {
            animation: pulse-red 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Mock Lucide Icons (since we're using a script tag)
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const StatusIndicator = ({ status }) => {
            const colors = {
                healthy: "bg-mint",
                incident: "bg-red animate-pulse-red",
                pending: "bg-orange",
                offline: "bg-muted"
            };
            return (
                <div className="flex items-center gap-2 px-3 py-1 bg-surface border border-border rounded-full shadow-sm">
                    <div className={`w-2 h-2 rounded-full ${colors[status] || colors.offline}`} />
                    <span className="font-mono text-[10px] uppercase tracking-wide font-medium">
                        {status === 'healthy' ? 'System Operational' : 'Incident Active'}
                    </span>
                </div>
            );
        };

        const StatCard = ({ label, value, trend, color = "lilac" }) => (
            <div className="bg-surface p-4 rounded-xl border border-border shadow-sm flex flex-col gap-1">
                <div className="flex items-center justify-between">
                    <span className="font-mono text-[10px] uppercase tracking-wide text-muted">{label}</span>
                    <div className={`w-2 h-2 rounded-full bg-${color}`} />
                </div>
                <div className="text-2xl font-semibold">{value}</div>
                {trend && <div className="text-xs text-muted">{trend}</div>}
            </div>
        );

        const ActionButton = ({ label, icon, variant = "lilac", onClick }) => {
            const variants = {
                lilac: "bg-lilac/20 text-primary border-lilac hover:bg-lilac/30",
                mint: "bg-mint/20 text-primary border-mint hover:bg-mint/30",
                blue: "bg-blue/20 text-primary border-blue hover:bg-blue/30",
                outline: "bg-transparent border-border hover:bg-surface-interactive"
            };
            return (
                <button 
                    onClick={onClick}
                    className={`flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border font-medium transition-all ${variants[variant]}`}
                >
                    <Icon name={icon} size={18} />
                    <span>{label}</span>
                </button>
            );
        };

        const ApprovalCard = ({ action, description, onApprove, onReject }) => (
            <div className="bg-surface border-2 border-lilac p-4 rounded-xl shadow-md flex flex-col gap-4">
                <div className="flex items-start justify-between">
                    <div>
                        <div className="font-mono text-[10px] uppercase tracking-wide text-lilac font-bold mb-1">Approval Required</div>
                        <h3 className="font-semibold text-lg">{action}</h3>
                    </div>
                    <Icon name="shield-alert" className="text-lilac" />
                </div>
                <p className="text-sm text-muted">{description}</p>
                <div className="flex gap-2">
                    <button onClick={onApprove} className="flex-1 bg-lilac text-primary font-bold py-2 rounded-lg hover:opacity-90">Approve Action</button>
                    <button onClick={onReject} className="px-4 border border-border text-muted py-2 rounded-lg hover:bg-bg">Reject</button>
                </div>
                <div className="text-[10px] font-mono text-muted text-center italic">Requires peer review</div>
            </div>
        );

        const FeedItem = ({ status, time, service, detail }) => {
            const borderColors = {
                critical: "border-red",
                recovery: "border-mint",
                info: "border-blue"
            };
            return (
                <div className={`bg-surface p-3 rounded-lg border border-border border-l-4 ${borderColors[status] || 'border-lilac'} shadow-sm flex flex-col gap-1`}>
                    <div className="flex justify-between items-center">
                        <span className="font-bold text-sm">{service}</span>
                        <span className="font-mono text-[10px] text-muted">{time}</span>
                    </div>
                    <p className="text-xs text-muted">{detail}</p>
                </div>
            );
        };

        const App = () => {
            const [hasIncident, setHasIncident] = useState(false);
            const [showApproval, setShowApproval] = useState(false);
            const [activeThread, setActiveThread] = useState(null);

            const threads = [
                { id: 1, title: 'Keycloak OOM Analysis', type: 'Agent Thought Process', content: 'Analyzing memory dumps from node-4... Heap usage at 94%. Garbage collection overhead limit exceeded. Recommending heap size increase or redeploy.' },
                { id: 2, title: 'System Logs (node-4)', type: 'Raw Logs', content: 'May 09 14:02:11 node-4 keycloak[4012]: java.lang.OutOfMemoryError: Java heap space\nMay 09 14:02:12 node-4 systemd[1]: keycloak.service: Main process exited, code=exited, status=1/FAILURE' }
            ];

            return (
                <div className="flex h-screen w-full overflow-hidden">
                    {/* Sidebar */}
                    <aside className="w-64 border-r border-border bg-surface flex flex-col">
                        <div className="p-6 border-b border-border flex items-center gap-2">
                            <div className="w-8 h-8 bg-lilac rounded-lg flex items-center justify-center text-primary font-bold">LO</div>
                            <h1 className="text-xl font-bold tracking-tight">LiveOps</h1>
                        </div>
                        <nav className="flex-1 p-4 flex flex-col gap-2">
                            {['Dashboard', 'Incidents', 'Infrastructure', 'Settings'].map(item => (
                                <div key={item} className={`px-4 py-2 rounded-lg text-sm font-medium cursor-pointer ${item === 'Dashboard' ? 'bg-lilac/10 text-primary' : 'text-muted hover:bg-bg'}`}>
                                    {item}
                                </div>
                            ))}
                        </nav>
                        
                        {/* Thread List in Sidebar */}
                        <div className="p-4 border-t border-border">
                            <div className="font-mono text-[10px] uppercase tracking-wide text-muted mb-3 flex items-center justify-between">
                                <span>Active Threads</span>
                                <span className="bg-lilac/20 px-1 rounded text-primary">{threads.length}</span>
                            </div>
                            <div className="flex flex-col gap-2">
                                {threads.map(t => (
                                    <div 
                                        key={t.id} 
                                        onClick={() => setActiveThread(t)}
                                        className="p-2 rounded-lg border border-border bg-bg/50 hover:bg-lilac/5 cursor-pointer transition-colors"
                                    >
                                        <div className="text-[10px] font-mono text-muted mb-1">{t.type}</div>
                                        <div className="text-xs font-semibold truncate">{t.title}</div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="p-4 border-t border-border">
                            <div className="flex items-center gap-3 px-3 py-2 bg-bg rounded-lg">
                                <div className="w-2 h-2 rounded-full bg-mint" />
                                <span className="font-mono text-[10px] uppercase tracking-wide">SSE Connected</span>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col bg-bg overflow-y-auto">
                        <header className="h-16 border-b border-border bg-surface px-8 flex items-center justify-between sticky top-0 z-10">
                            <div className="flex items-center gap-4">
                                <h2 className="font-semibold">NOC Overview</h2>
                                <StatusIndicator status={hasIncident ? 'incident' : 'healthy'} />
                            </div>
                            <div className="flex items-center gap-3">
                                <div className="flex -space-x-2">
                                    {[1, 2, 3].map(i => (
                                        <div key={i} className="w-7 h-7 rounded-full border-2 border-surface bg-lilac/30 flex items-center justify-center text-[10px] font-bold">JD</div>
                                    ))}
                                </div>
                                <div className="w-px h-6 bg-border mx-1" />
                                <Icon name="bell" className="text-muted" />
                            </div>
                        </header>

                        <div className="p-8 flex flex-col gap-8 max-w-6xl mx-auto w-full">
                            {hasIncident && (
                                <div className="bg-red/10 border border-red/20 p-4 rounded-xl flex items-center justify-between animate-in fade-in slide-in-from-top-4">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-red rounded-full flex items-center justify-center text-white animate-pulse">
                                            <Icon name="alert-circle" />
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-red">Keycloak Service Down</h3>
                                            <p className="text-sm text-red/80">Critical impact detected in Auth layer</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setHasIncident(false)}
                                        className="text-xs font-mono uppercase tracking-widest text-red/60 hover:text-red"
                                    >
                                        Acknowledge
                                    </button>
                                </div>
                            )}

                            {!hasIncident ? (
                                <div className="flex flex-col items-center justify-center py-20 text-center gap-4 bg-surface rounded-2xl border border-border border-dashed">
                                    <div className="w-16 h-16 bg-mint/10 text-mint rounded-full flex items-center justify-center">
                                        <Icon name="heart" size={32} />
                                    </div>
                                    <div>
                                        <h3 className="text-xl font-bold">All Systems Operational</h3>
                                        <p className="text-muted">No active incidents detected. Peace reigns in the NOC.</p>
                                    </div>
                                    <button 
                                        onClick={() => setHasIncident(true)}
                                        className="mt-4 text-xs font-mono text-muted underline decoration-lilac underline-offset-4"
                                    >
                                        Simulate Incident
                                    </button>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    {/* Dashboard Stats */}
                                    <div className="flex flex-col gap-4">
                                        <div className="grid grid-cols-2 gap-4">
                                            <StatCard label="Service" value="Keycloak" color="red" />
                                            <StatCard label="Status" value="Down" color="red" />
                                            <StatCard label="Error Rate" value="98.2%" trend="+84% vs baseline" color="orange" />
                                            <StatCard label="Impact" value="1.2k Users" trend="Growing..." color="orange" />
                                        </div>
                                        
                                        <div className="bg-surface p-6 rounded-xl border border-border shadow-sm flex flex-col gap-4">
                                            <div className="font-mono text-[10px] uppercase tracking-wide text-muted">Available Remediation</div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <ActionButton 
                                                    label="Redeploy" 
                                                    icon="refresh-cw" 
                                                    variant="lilac" 
                                                    onClick={() => setShowApproval(true)} 
                                                />
                                                <ActionButton 
                                                    label="Recover Memory" 
                                                    icon="database" 
                                                    variant="mint" 
                                                    onClick={() => {}} 
                                                />
                                                <ActionButton 
                                                    label="Status Check" 
                                                    icon="search" 
                                                    variant="blue" 
                                                    onClick={() => {}} 
                                                />
                                                <ActionButton 
                                                    label="Generate Action" 
                                                    icon="sparkles" 
                                                    variant="outline" 
                                                    onClick={() => {}} 
                                                />
                                            </div>
                                        </div>

                                        {showApproval && (
                                            <ApprovalCard 
                                                action="Redeploy Keycloak"
                                                description="This will restart all instances of the Keycloak auth service in the production cluster. Minimal downtime expected."
                                                onApprove={() => {
                                                    setShowApproval(false);
                                                    setHasIncident(false);
                                                }}
                                                onReject={() => setShowApproval(false)}
                                            />
                                        )}
                                    </div>

                                    {/* Incident Feed */}
                                    <div className="bg-surface rounded-xl border border-border shadow-sm flex flex-col overflow-hidden">
                                        <div className="p-4 border-b border-border flex justify-between items-center bg-bg/50">
                                            <span className="font-mono text-[10px] uppercase tracking-wide font-bold">Incident Timeline</span>
                                            <Icon name="more-horizontal" className="text-muted" size={16} />
                                        </div>
                                        <div className="p-4 flex flex-col gap-3 overflow-y-auto max-h-[500px]">
                                            <FeedItem 
                                                status="critical" 
                                                time="14:02:11" 
                                                service="Keycloak" 
                                                detail="Health check failed: Timeout after 5000ms" 
                                            />
                                            <FeedItem 
                                                status="info" 
                                                time="14:02:15" 
                                                service="CopilotAgent" 
                                                detail="Analyzing logs for root cause..." 
                                            />
                                            <FeedItem 
                                                status="info" 
                                                time="14:03:02" 
                                                service="CopilotAgent" 
                                                detail="Root cause identified: Out of Memory on node-4" 
                                            />
                                            <FeedItem 
                                                status="recovery" 
                                                time="13:45:00" 
                                                service="Auth-Service" 
                                                detail="Previous deployment successful" 
                                            />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Stats Grid Footer */}
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
                                <div className="p-4 bg-surface/50 border border-border rounded-xl">
                                    <div className="font-mono text-[10px] uppercase text-muted mb-1">Last Incident</div>
                                    <div className="font-semibold">2h 14m ago</div>
                                </div>
                                <div className="p-4 bg-surface/50 border border-border rounded-xl">
                                    <div className="font-mono text-[10px] uppercase text-muted mb-1">MTTR</div>
                                    <div className="font-semibold">12m 45s</div>
                                </div>
                                <div className="p-4 bg-surface/50 border border-border rounded-xl">
                                    <div className="font-mono text-[10px] uppercase text-muted mb-1">Uptime</div>
                                    <div className="font-semibold text-mint">99.98%</div>
                                </div>
                                <div className="p-4 bg-surface/50 border border-border rounded-xl">
                                    <div className="font-mono text-[10px] uppercase text-muted mb-1">On-Call</div>
                                    <div className="font-semibold">SRE-Team-A</div>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Copilot Sidebar V2 (Mocked) */}
                    <div className="w-80 border-l border-border bg-surface flex flex-col relative">
                        <div className="p-6 border-b border-border flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <Icon name="bot" className="text-lilac" />
                                <h3 className="font-bold">Copilot</h3>
                            </div>
                            <div className="w-2 h-2 rounded-full bg-mint" />
                        </div>
                        <div className="flex-1 p-4 overflow-y-auto flex flex-col gap-4">
                            <div className="bg-bg p-3 rounded-xl rounded-tl-none text-sm self-start max-w-[90%]">
                                Hello! I'm monitoring the NOC. Keycloak seems to be having issues. Would you like me to analyze the logs?
                            </div>
                            {hasIncident && (
                                <div className="bg-lilac/10 border border-lilac/20 p-3 rounded-xl text-sm self-start max-w-[90%]">
                                    I've identified an OOM error on node-4. I recommend redeploying the service. Should I prepare the action?
                                </div>
                            )}
                        </div>
                        <div className="p-4 border-t border-border">
                            <div className="relative">
                                <input 
                                    type="text" 
                                    placeholder="Ask Copilot..." 
                                    className="w-full bg-bg border border-border rounded-xl py-2 px-4 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-lilac/50"
                                />
                                <div className="absolute right-3 top-2 text-lilac">
                                    <Icon name="send" size={16} />
                                </div>
                            </div>
                        </div>

                        {/* Thread Drawer (Overlay) */}
                        {activeThread && (
                            <div className="absolute inset-0 bg-surface z-20 flex flex-col animate-in slide-in-from-right duration-200">
                                <div className="p-4 border-b border-border flex items-center justify-between">
                                    <button onClick={() => setActiveThread(null)} className="p-1 hover:bg-bg rounded-lg">
                                        <Icon name="chevron-left" />
                                    </button>
                                    <div className="font-mono text-[10px] uppercase tracking-wide text-muted">{activeThread.type}</div>
                                    <div className="w-6" />
                                </div>
                                <div className="p-6 flex flex-col gap-4">
                                    <h3 className="font-bold text-lg">{activeThread.title}</h3>
                                    <div className="bg-bg p-4 rounded-xl border border-border font-mono text-xs whitespace-pre-wrap leading-relaxed">
                                        {activeThread.content}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
